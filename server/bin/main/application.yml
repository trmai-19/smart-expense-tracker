server:
  port: 8080

spring:
  application:
    name: smart-expense-tracker-api

  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/smartexpense}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD:postgres}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: update
    show-sql: true
    properties:
      hibernate:
        format_sql: true
        dialect: org.hibernate.dialect.PostgreSQLDialect

  jackson:
    serialization:
      write-dates-as-timestamps: false
    deserialization:
      fail-on-unknown-properties: false

  servlet:
    multipart:
      max-file-size: 10MB
      max-request-size: 15MB

# Security / JWT Configuration
jwt:
  secret: ${JWT_SECRET:smartExpenseTrackerSuperSecretKeyForJwtAuthentication2026Secure}
  expiration-ms: 86400000 # 24 hours

# Gemini AI API Configuration
gemini:
  api-key: ${GEMINI_API_KEY:YOUR_GEMINI_API_KEY_HERE}
  model: gemini-1.5-flash
